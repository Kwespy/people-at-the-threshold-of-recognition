<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>People at the Threshold of Recognition</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

      background: #000;
      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    #stage {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #000;
    }


    #image {

      position: absolute;

      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      object-position:
        center center;

      display: block;

      z-index: 1;

      user-select: none;

      -webkit-user-drag: none;

      background: #000;
    }


    #stage::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:

        linear-gradient(

          to bottom,

          rgba(
            0,
            0,
            0,
            0.55
          )
          0%,

          rgba(
            0,
            0,
            0,
            0.10
          )
          20%,

          rgba(
            0,
            0,
            0,
            0
          )
          50%,

          rgba(
            0,
            0,
            0,
            0.55
          )
          100%

        );
    }


    #metadata {

      position: absolute;

      top: 28px;
      left: 0;

      z-index: 10;

      width: max-content;
      max-width: min(680px, 92vw);

      padding:
        7px 14px
        7px 30px;

      background: #000;

      font-size: 13px;

      line-height: 1.55;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      pointer-events: none;
    }


    .label {
      opacity: 0.55;
    }


    #caption {

      position: absolute;

      left: 0;
      bottom: 28px;

      z-index: 10;

      width: max-content;
      max-width: 92vw;

      padding:
        7px 14px
        7px 30px;

      background: #000;

      font-size: 13px;

      letter-spacing: 0.03em;

      text-transform: uppercase;

      pointer-events: none;
    }


    #sourceInfo {

      position: absolute;

      right: 0;
      bottom: 28px;

      z-index: 10;

      width: max-content;
      max-width: min(520px, 92vw);

      padding:
        7px 30px
        7px 14px;

      background: #000;

      text-align: right;

      font-size: 9px;

      line-height: 1.55;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.78);

      opacity: 1;

      pointer-events: none;
    }



    #projectInfo {

      position: absolute;

      top: 28px;
      right: 0;

      z-index: 10;

      width: 420px;
      max-width: 46vw;

      padding:
        9px 30px
        9px 14px;

      background: #000;

      text-align: right;

      font-size: 9px;

      line-height: 1.55;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.78);

      pointer-events: none;
    }


    #languageSwitch {

      position: absolute;

      top: 28px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 30;

      display: flex;

      background: #000;

      padding:
        5px 7px;

      font-size: 9px;

      line-height: 1;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }


    #languageSwitch button {

      appearance: none;

      border: 0;

      margin: 0;
      padding:
        3px 5px;

      background: transparent;

      color:
        rgba(
          255,
          255,
          255,
          0.42
        );

      font: inherit;

      cursor: pointer;
    }


    #languageSwitch button.active {

      color: #fff;
    }


    #languageSwitch .separator {

      padding:
        3px 1px;

      color:
        rgba(
          255,
          255,
          255,
          0.28
        );

      pointer-events: none;
    }


    .arrow {

      position: absolute;

      top: 0;
      bottom: 0;

      width: 96px;

      z-index: 20;

      padding: 0;
      border: 0;

      background: transparent;

      color: #fff;

      cursor: pointer;

      opacity: 0.88;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

      -webkit-tap-highlight-color: transparent;
    }


    .arrow svg {

      width: 42px;
      height: 42px;

      display: block;

      margin: 0 auto;

      fill: none;

      stroke: #fff;

      stroke-width: 3.6;

      stroke-linecap: round;
      stroke-linejoin: round;

      vector-effect: non-scaling-stroke;

      filter:
        drop-shadow(
          0 1px 2px
          rgba(0, 0, 0, 0.72)
        );
    }


    .arrow:hover {
      opacity: 1;
    }


    .arrow:active {
      transform: scale(0.96);
    }


    #prev {
      left: 0;
    }


    #next {
      right: 0;
    }


    #searching {

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(
          -50%,
          -50%
        );

      z-index: 100;

      padding:
        10px 14px;

      background:
        rgba(
          0,
          0,
          0,
          0.80
        );

      font-size: 11px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s ease;

      white-space: nowrap;
    }


    #searching.visible {
      opacity: 1;
    }


    @media (
      max-width: 700px
    ) {


      #languageSwitch {

        top: 18px;

        padding:
          4px 5px;

        font-size: 8px;
      }


      #metadata {

        top: 18px;
        left: 0;

        max-width: 94vw;

        padding:
          6px 12px
          6px 18px;

        font-size: 10px;
      }


      #caption {

        left: 0;
        bottom: 18px;

        max-width: 94vw;

        padding:
          6px 12px
          6px 18px;

        font-size: 11px;
      }



      #projectInfo {

        top: 18px;
        right: 0;

        width: 52vw;
        max-width: 52vw;

        padding:
          6px 18px
          6px 10px;

        font-size: 8px;

        line-height: 1.45;
      }


      #sourceInfo {
        display: none;
      }


      .arrow {

        width: 62px;
      }


      .arrow svg {

        width: 34px;
        height: 34px;

        stroke-width: 3.5;
      }

    }

  

    /* ======================================================
       RESPONSIVE / MOBILE PRESENTATION PATCH
       SOLO PRESENTACIÓN. La lógica LIVE queda intacta.
       ====================================================== */

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;

      /* Evita que Safari/Chrome móvil agranden el texto
         automáticamente al girar el teléfono. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #stage {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    #image {
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
    }

    /* El título visible desaparece, pero el elemento sigue
       existiendo para no romper el JS. */
    #caption {
      display: none !important;
    }

    /* El selector manual de idioma desaparece, pero se mantiene
       en el DOM para que el sistema bilingüe siga funcionando. */
    #languageSwitch {
      display: none !important;
    }

    /* FRONTERA + EVENTO siempre visibles */
    #metadata {
      top: max(14px, env(safe-area-inset-top));
      left: 0;
      width: max-content;
      max-width: min(760px, 92vw);
      padding:
        7px 12px
        7px max(14px, env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.82);
    }

    /* La descripción ya no aparece separada.
       El nodo sigue existiendo para no tocar la lógica de idioma. */
    #projectInfo {
      display: none !important;
    }

    /* FUENTE / UBICACIÓN / APARATO:
       oculto hasta pulsar INFO */
    #sourceInfo {
      display: none;
      right: max(12px, env(safe-area-inset-right));
      bottom:
        calc(
          max(12px, env(safe-area-inset-bottom))
          + 37px
        );
      width: auto;
      max-width: min(520px, 82vw);
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.90);
      text-align: right;
      font-size: 9px;
      line-height: 1.5;
      pointer-events: none;
    }

    #sourceInfo.open {
      display: block;
    }

    #sourceInfo .infoDescription {
      margin: 0 0 8px 0;
      padding: 0 0 8px 0;
      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.22);

      text-align: left;
      text-transform: none;
      color: rgba(255, 255, 255, 0.92);

      font-size: 10px;
      line-height: 1.45;
      letter-spacing: 0.015em;
    }

    #sourceInfo .infoDetails {
      text-align: right;
      text-transform: uppercase;
    }

    #sourceToggle {
      position: absolute;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 40;

      appearance: none;
      border:
        1px solid
        rgba(255, 255, 255, 0.48);
      border-radius: 2px;

      margin: 0;
      padding: 5px 7px;

      background: rgba(0, 0, 0, 0.72);
      color: #fff;

      font: inherit;
      font-size: 8px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #sourceToggle:active {
      background: rgba(255, 255, 255, 0.14);
    }

    @media (max-width: 700px) {

      #stage {
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
      }

      #image {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #metadata {
        top: max(10px, env(safe-area-inset-top));
        max-width: 88vw;

        padding:
          5px 8px
          5px max(10px, env(safe-area-inset-left));

        font-size: 9px;
        line-height: 1.4;
        letter-spacing: 0.03em;
      }

      #sourceInfo {
        display: none;

        right: max(10px, env(safe-area-inset-right));
        bottom:
          calc(
            max(10px, env(safe-area-inset-bottom))
            + 34px
          );

        max-width: 80vw;

        padding: 7px 8px;

        font-size: 8px;
        line-height: 1.45;
      }

      #sourceInfo.open {
        display: block;
      }

      #sourceInfo .infoDescription {
        margin-bottom: 6px;
        padding-bottom: 6px;
        font-size: 8px;
        line-height: 1.38;
      }

      #sourceInfo .infoDetails {
        font-size: 8px;
        line-height: 1.45;
      }

      #sourceToggle {
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));

        padding: 5px 6px;

        font-size: 7px;
      }

      .arrow {
        width: 50px;
      }

      .arrow svg {
        width: 30px;
        height: 30px;
      }

      #searching {
        max-width: 86vw;
        white-space: normal;
        text-align: center;
        font-size: 9px;
      }
    }

    @supports (-webkit-touch-callout: none) {
      #stage {
        height: -webkit-fill-available;
      }
    }


    /* Mantiene exactamente la escala tipográfica móvil
       aunque el teléfono esté en horizontal y supere 700px. */
    @media (hover: none) and (pointer: coarse) {

      #metadata {
        top: max(10px, env(safe-area-inset-top));
        max-width: 88vw;
        padding:
          5px 8px
          5px max(10px, env(safe-area-inset-left));
        font-size: 9px;
        line-height: 1.4;
        letter-spacing: 0.03em;
      }

      #sourceInfo,
      #sourceInfo.open {
        right: max(10px, env(safe-area-inset-right));
        bottom:
          calc(
            max(10px, env(safe-area-inset-bottom))
            + 34px
          );
        max-width: 80vw;
        padding: 7px 8px;
        font-size: 8px;
        line-height: 1.45;
      }

      #sourceInfo .infoDescription {
        font-size: 8px;
        line-height: 1.38;
      }

      #sourceInfo .infoDetails {
        font-size: 8px;
        line-height: 1.45;
      }

      #sourceToggle {
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        padding: 5px 6px;
        font-size: 7px;
      }

      #searching {
        max-width: 86vw;
        white-space: normal;
        text-align: center;
        font-size: 9px;
      }

      .arrow {
        width: 50px;
      }

      .arrow svg {
        width: 30px;
        height: 30px;
      }
    }


    /* ======================================================
       MOBILE IMAGE PAN / EDGE SWIPE
       Permite recorrer horizontalmente imágenes recortadas
       por object-fit: cover sin dejar espacios vacíos.
       ====================================================== */

    #panHint {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 35;
      transform: translateX(-50%);
      padding: 5px 8px;
      background: rgba(0, 0, 0, 0.72);
      color: rgba(255, 255, 255, 0.92);
      font-size: 8px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    #panHint.visible {
      opacity: 1;
    }

    @media (hover: none) and (pointer: coarse) {
      #stage {
        touch-action: pan-y;
      }

      #image {
        will-change: object-position;
      }

      #panHint {
        display: block;
      }
    }

  </style>

</head>


<body>


  <main id="stage">


    <img
      id="image"
      alt=""
      decoding="async"
      fetchpriority="high"
    >


    <div id="metadata">

      <div id="borderLine"></div>

      <div id="eventLine"></div>

    </div>


    <button
      id="prev"
      class="arrow"
      aria-label="Previous image"
    >
      <svg
        viewBox="0 0 48 48"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M30 10 L16 24 L30 38"></path>
        <path d="M17 24 H39"></path>
      </svg>
    </button>


    <button
      id="next"
      class="arrow"
      aria-label="Next image"
    >
      <svg
        viewBox="0 0 48 48"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M18 10 L32 24 L18 38"></path>
        <path d="M9 24 H31"></path>
      </svg>
    </button>


    <div id="caption">
      <span id="captionText"></span>
    </div>


    <div id="sourceInfo"></div>

    <button
      id="sourceToggle"
      type="button"
      aria-expanded="false"
      aria-controls="sourceInfo"
      aria-label="Source, location and apparatus"
    >
      INFO
    </button>


    <div
      id="panHint"
      aria-hidden="true"
    ></div>


    <div id="projectInfo"></div>


    <div id="searching"></div>


    <div
      id="languageSwitch"
      aria-label="Language"
    >
      <button
        id="langEs"
        type="button"
        aria-label="Español"
      >
        ES
      </button>

      <span class="separator">/</span>

      <button
        id="langEn"
        type="button"
        aria-label="English"
      >
        EN
      </button>
    </div>


  </main>


  <script>

    // ======================================================
    // BORDER TRANSIT
    //
    // HYBRID CLIENT
    //
    // With live_server.py:
    //   /api/bootstrap + /api/live-next
    //
    // Without Python API:
    //   ./manifest.json
    //   fallback ./pool.json
    //
    // IMPORTANT:
    // Asset paths are made relative so the page works at:
    //
    // username.github.io/repository/
    //
    // as well as at a custom domain.
    // ======================================================


    const image =
      document.getElementById(
        "image"
      );


    const borderLine =
      document.getElementById(
        "borderLine"
      );


    const eventLine =
      document.getElementById(
        "eventLine"
      );


    const sourceInfo =
      document.getElementById(
        "sourceInfo"
      );

    const sourceToggle =
      document.getElementById(
        "sourceToggle"
      );


    const panHint =
      document.getElementById(
        "panHint"
      );


    sourceToggle.addEventListener(
      "click",
      () => {

        const isOpen =
          sourceInfo.classList.toggle(
            "open"
          );

        sourceToggle.setAttribute(
          "aria-expanded",
          isOpen
          ?
          "true"
          :
          "false"
        );
      }
    );


    const searching =
      document.getElementById(
        "searching"
      );


    const captionText =
      document.getElementById(
        "captionText"
      );


    const projectInfo =
      document.getElementById(
        "projectInfo"
      );


    const previousButton =
      document.getElementById(
        "prev"
      );


    const nextButton =
      document.getElementById(
        "next"
      );


    const langEsButton =
      document.getElementById(
        "langEs"
      );


    const langEnButton =
      document.getElementById(
        "langEn"
      );



    // ======================================================
    // LANGUAGE / I18N
    //
    // Default:
    // browser language.
    //
    // Manual ES / EN selection is stored locally.

    // No translation service or API is used.
    // Both texts live directly in this HTML.

      en: {

        title: "People at the Threshold of Recognition",

        description:
  "<strong>People at the Threshold of Recognition</strong> works with images of people crossing borders, recorded by remote, automatic, or continuous cameras and systems. In many cases, an image can be captured without a person deciding the exact moment it is taken.<br><br>An algorithm used by the project then detects human presence in these images. The selected images go through different transformations that move them toward a point between recognition and illegibility.<br><br>The work connects this transformation of the image with the situation of crossing a border. In this context, a person can be detected and recorded by technical systems as presence, movement, or data, without this meaning that the system recognizes who they are or what their situation is. A difference appears between detection and recognition: a machine can identify that a person is there without recognizing them as someone. The territorial crossing is therefore connected to another threshold, between being seen, being detected, and being recognized.",

        error:

        noImage:
          "NO IMAGE AVAILABLE",

        noItems:
          "NO DISPLAYABLE IMAGES",

        previous:

        next:
          "Next image",

        imageAlt:

        dragExplore:
          "↔ DRAG TO EXPLORE",

        language:

      },


      es: {

        title: "Personas en el Umbral del Reconocimiento",

        description:
  "<strong>Personas en el umbral del reconocimiento</strong> trabaja con imágenes de personas que cruzan fronteras, registradas por cámaras y sistemas remotos, automáticos o continuos. En muchos casos, una imagen puede ser capturada sin que una persona decida el momento exacto de la toma.<br><br>Luego, un algoritmo del propio proyecto detecta presencia humana en estas imágenes. Las imágenes seleccionadas pasan por distintas transformaciones que las llevan hacia un punto entre el reconocimiento y la ilegibilidad.<br><br>La obra relaciona esta transformación de la imagen con la situación de cruzar una frontera. En ese contexto, una persona puede ser detectada y registrada por sistemas técnicos como presencia, movimiento o dato, sin que eso signifique reconocer quién es o cuál es su situación. Aparece así una diferencia entre detectar y reconocer: una máquina puede identificar que hay una persona sin reconocerla como alguien. El cruce territorial se conecta entonces con otro umbral, entre ser visto, ser detectado y ser reconocido.",

        )

        navigator.languages.length > 0

        navigator.languages

      const spanish =

            String(

            .toLowerCase()

      return spanish

    // ======================================================
    // CONFIG
    // ======================================================

    const PRELOAD_AHEAD = 4;

    const SHUFFLE_ON_START = true;

    // Cada 3 avances, si ya existe una transformación LIVE
    // preparada, se inserta entre las pre-renderizadas.
    const LIVE_EVERY = 3;

    const LIVE_CLIENT_TARGET = 2;


    // ======================================================
    // STATE
    // ======================================================

    let items = [];

    let deck = [];

    let deckIndex = 0;

    let history = [];

    let historyIndex = -1;

    let liveMode = false;

    let liveItems = [];

    let liveRequestRunning = false;

    let liveSequence = 0;

    let forwardSequence = 0;

    // ------------------------------------------------------
    // Visible-source cycle.
    //
    // A source image cannot be selected again until every
    // source in the current archive has appeared once.
    //
    // LIVE results inherit the original pool ID, therefore
    // a static render and a new LIVE transformation of the
    // same source count as the same source for repetition.
    // ------------------------------------------------------

    let totalUniqueSources = 0;

    const shownSourceKeys =
      new Set();

    let lastShownSourceKey = null;

    let searchingState =
      "loading";

    const preloadCache =
      new Map();


    // ======================================================
    // HELPERS
    // ======================================================

    function safe(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return null;
      }


      return String(
        value
      );
    }


    function shuffle(array) {

      const copy =
        [...array];


      for (
        let i = copy.length - 1;
        i > 0;
        i -= 1
      ) {

        const j =
          Math.floor(
            Math.random()
            *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ]
        =
        [
          copy[j],
          copy[i]
        ];
      }


      return copy;
    }


    // ======================================================
    // SOURCE IDENTITY / NO-REPEAT CYCLE
    // ======================================================

    function sourceKey(item) {

      if (!item) {
        return null;
      }


      const value =

        item.id
        ??
        item.pool_id
        ??
        item.original
        ??
        item.original_file
        ??
        item.source_id
        ??
        item.source_filename
        ??
        item.file
        ??
        item.filename
        ??
        item.rendered_file;


      return safe(
        value
      );
    }


    function rebuildCycleDeck() {

      const remaining =
        items.filter(
          item => {

            const key =
              sourceKey(
                item
              );


            return (
              key
              &&
              !shownSourceKeys.has(
                key
              )
            );
          }
        );


      deck =

        SHUFFLE_ON_START

        ?

        shuffle(
          remaining
        )

        :

        [...remaining];


      deckIndex = 0;


      // Cuando comienza un ciclo nuevo,
      // evita que la primera fuente sea la misma
      // que cerró el ciclo anterior.

      if (
        deck.length > 1
        &&
        lastShownSourceKey
        &&
        sourceKey(
          deck[0]
        )
        ===
        lastShownSourceKey
      ) {

        [
          deck[0],
          deck[1]
        ]
        =
        [
          deck[1],
          deck[0]
        ];
      }
    }


    function configureSourceCycle() {

      const keys =
        items
        .map(
          sourceKey
        )
        .filter(
          Boolean
        );


      totalUniqueSources =
        new Set(
          keys
        ).size;


      shownSourceKeys.clear();

      lastShownSourceKey =
        null;


      rebuildCycleDeck();
    }


    function prepareNewCycleIfNeeded() {

      if (
        totalUniqueSources > 0
        &&
        shownSourceKeys.size
        >=
        totalUniqueSources
      ) {

        shownSourceKeys.clear();


        rebuildCycleDeck();


        console.log(
          "SOURCE CYCLE / complete — reshuffled"
        );
      }
    }


    function sourceAlreadyShown(item) {

      const key =
        sourceKey(
          item
        );


      return (
        key
        &&
        shownSourceKeys.has(
          key
        )
      );
    }


    function markSourceShown(item) {

      const key =
        sourceKey(
          item
        );


      if (!key) {
        return;
      }


      shownSourceKeys.add(
        key
      );


      lastShownSourceKey =
        key;
    }


    function showSearching(state) {

      searchingState =
        state

      searching.textContent =

      searching.classList.add(

    function hideSearching() {

    // ======================================================
    // PATH NORMALIZATION
    //
    // "/rendered/0001.webp"
    // becomes
    // "./rendered/0001.webp"
    //
    // This is important on GitHub project Pages.
    // ======================================================

    function relativeAssetPath(value) {

      const path =
        safe(value);


      if (!path) {
        return null;
      }


      if (
        path.startsWith(
          "http://"
        )
        ||
        path.startsWith(
          "https://"
        )
        ||
        path.startsWith(
          "data:"
        )
        ||
        path.startsWith(
          "blob:"
        )
      ) {

        return path;
      }


      const clean =
        path
        .replace(
          /^\.?\//,
          ""
        );


      return (
        "./"
        +
        clean
      );
    }


    function getRenderedFile(item) {

      const direct =

        safe(
          item.rendered_file
        )

        ||

        safe(
          item.rendered
        )

        ||

        safe(
          item.web_file
        )

        ||

        safe(
          item.display_file
        );


      if (direct) {

        return relativeAssetPath(
          direct
        );
      }


      // Fallback when manifest stores only filename/id.

      const filename =

        safe(
          item.filename
        )

        ||

        safe(
          item.original_filename
        );


      if (filename) {

        const stem =
          filename.replace(
            /\.[^.]+$/,
            ""
          );


        return (
          "./rendered/"
          +
          stem
          +
          ".webp"
        );
      }


      const id =

        safe(
          item.id
        )

        ||

        safe(
          item.pool_id
        );


      if (id) {

        const numeric =
          String(id).padStart(
            4,
            "0"
          );


        return (
          "./rendered/"
          +
          numeric
          +
          ".webp"
        );
      }


      return null;
    }


    // ======================================================
    // BORDER
    // ======================================================

    function getBorder(item) {

      const from =
        safe(
          item.from_country
          ||
          item.from
        );


      const to =
        safe(
          item.to_country
          ||
          item.to
        );


      if (
        item.route_documented
        ===
        true
        &&
        from
        &&
        to
      ) {

        return (
          from
          +
          " → "
          +
          to
        );
      }


      return (

        safe(
          item.border
        )

        ||

        safe(
          item.border_hint
        )

        ||

        safe(
          item.route_name
        )

        ||

        t("undocumentedBorder")

      );
    }


    // ======================================================
    // EVENT
    // ======================================================

    function getEvent(item) {

      const date =
        safe(
          item.event_date
          ||
          item.date
        );


      const time =
        safe(
          item.event_time_local
        );


      if (
        date
        &&
        time
      ) {

        return (
          date
          +
          " · "
          +
          time.slice(
            0,
            5
          )
        );
      }


      return date;
    }


    // ======================================================
    // SOURCE / OPERATION
    // ======================================================

    function getApparatus(item) {

      const raw = [];


      if (
        Array.isArray(
          item.documented_devices
        )
      ) {

        raw.push(
          ...item.documented_devices
        );
      }


      [
        item.apparatus,
        item.image_device,
        item.device,
        item.camera_model,
        item.capture_regime,
        item.capture_medium,
        item.origin
      ]
      .forEach(
        value => {

          const clean =
            safe(
              value
            );


          if (clean) {

            raw.push(
              clean
            );
          }
        }
      );


      const text =
        raw
        .join(
          " | "
        )
        .toLowerCase();


      // ====================================================
      // Aparatos claramente compatibles con captura
      // automática, pasiva, continua o remota.
      // ====================================================

      if (
        /trail camera|game camera|motion.?trigger/.test(
          text
        )
      ) {

        return t(
          "apparatusTrail"
        );
      }


      if (
        /autonomous|lattice|surveillance tower|computer vision|machine vision/.test(
          text
        )
      ) {

        return t(
          "apparatusAutonomousTower"
        );
      }


      if (
        /thermal|infrared|midwave infrared/.test(
          text
        )
        &&
        /drone|aerial|aircraft/.test(
          text
        )
      ) {

        return t(
          "apparatusThermalAerial"
        );
      }


      if (
        /thermal|infrared|midwave infrared/.test(
          text
        )
      ) {

        return t(
          "apparatusThermal"
        );
      }


      if (
        /drone|aerial|aircraft/.test(
          text
        )
      ) {

        return t(
          "apparatusAerial"
        );
      }


      if (
        /body.?worn|bodycam/.test(
          text
        )
      ) {

        return t(
          "apparatusBodycam"
        );
      }


      if (
        /cctv|security camera|fixed surveillance|surveillance camera|fixed camera|remote surveillance/.test(
          text
        )
      ) {

        return t(
          "apparatusFixed"
        );
      }


      if (
        /maritime|coast guard|cutter|interception|vessel/.test(
          text
        )
      ) {

        return t(
          "apparatusMaritime"
        );
      }


      if (
        /passive|continuous|sensor|unattended|automatic/.test(
          text
        )
      ) {

        return t(
          "apparatusPassive"
        );
      }


      // ====================================================
      // Si la metadata del aparato viene de una lógica
      // periodística — press / news / still photography —
      // NO se muestra eso como apparatus.
      //
      // La fuente periodística sigue apareciendo en SOURCE.
      // APPARATUS describe aquí el régimen de captura.
      // ====================================================

      if (
        /press|news|journal|photograph|photography|still camera|digital still/.test(
          text
        )
      ) {

        return t(
          "apparatusInferred"
        );
      }


      // Si hay una descripción técnica útil que no sea
      // periodística, conservarla.

      const technical =
        raw.filter(
          value => {

            return !(
              /press|news|journal|photograph|photography|still camera|digital still/i
              .test(
                String(
                  value
                )
              )
            );
          }
        );


      if (
        technical.length > 0
      ) {

        return technical.join(
          " + "
        );
      }


      // Último fallback: no inventa marca ni modelo.
      // Se explicita que es una inferencia de régimen.

      return t(
        "apparatusInferred"
      );
    }


    function getSourceInfo(item) {

      const lines = [];


      const institution =
        safe(
          item.institution
          ||
          item.publisher
          ||
          item.source
        );


      const location =
        safe(
          item.location
        );


      const apparatus =
        getApparatus(
          item
        );


      if (institution) {

        lines.push(
          t("source")
          +
          " / "
          +
          institution
        );
      }


      if (location) {

        lines.push(
          t("location")
          +
          " / "
          +
          location
        );
      }


      // Deliberadamente NO mostramos:
      //
      // OPERATION
      // TRANSFORMATION
      // operation_names
      // live_operations
      //
      // La transformación queda invisible en la interfaz.


      if (apparatus) {

        lines.push(
          t("apparatus")
          +
          " / "
          +
          apparatus
        );
      }


      return lines.join(
        "<br>"
      );
    }


    // ======================================================
    // NORMALIZE MANIFEST ITEM
    // ======================================================

    function normalizeItem(item) {

      const renderedFile =
        getRenderedFile(
          item
        );


      if (!renderedFile) {
        return null;
      }


      return {
        ...item,

        rendered_file:
          renderedFile
      };
    }

    // ======================================================
    // PRELOAD
    // ======================================================

    function preloadUrl(url) {

      if (
        !url
        ||
        preloadCache.has(
          url
        )
      ) {

        return;
      }


      const preload =
        new Image();


      preload.decoding =
        "async";


      preload.src =
        url;


      preloadCache.set(
        url,
        preload
      );
    }


    function preloadNext() {

      if (
        deck.length === 0
      ) {

        return;
      }


      for (
        let offset = 0;
        offset < PRELOAD_AHEAD;
        offset += 1
      ) {

        const index =
          (
            deckIndex
            +
            offset
          )
          %
          deck.length;


        const item =
          deck[
            index
          ];


        if (item) {

          preloadUrl(
            item.rendered_file
          );
        }
      }
    }


    // ======================================================
    // MANIFEST PARSING
    // ======================================================

    function extractItems(data) {

      if (
        Array.isArray(
          data
        )
      ) {

        return data;
      }


      if (
        data
        &&
        Array.isArray(
          data.items
        )
      ) {

        return data.items;
      }


      if (
        data
        &&
        Array.isArray(
          data.images
        )
      ) {

        return data.images;
      }


      if (
        data
        &&
        Array.isArray(
          data.pool
        )
      ) {

        return data.pool;
      }


      if (
        data
        &&
        Array.isArray(
          data.candidates
        )
      ) {

        return data.candidates;
      }


      return [];
    }


    // ======================================================
    // LOAD STATIC DATA
    // ======================================================

    async function loadJson(url) {

      const response =
        await fetch(
          url,
          {
            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          url
          +
          " / "
          +
          response.status
        );
      }


      return response.json();
    }


    async function loadArchive() {

      let data = null;


      // Preferred public web manifest.

      try {

        data =
          await loadJson(
            "./manifest.json"
          );
      }

      catch (manifestError) {

        console.warn(
          "manifest.json unavailable; trying pool.json",
          manifestError
        );


        data =
          await loadJson(
            "./pool.json"
          );
      }


      const rawItems =
        extractItems(
          data
        );


      items =
        rawItems
        .map(
          normalizeItem
        )
        .filter(
          Boolean
        );


      if (
        items.length === 0
      ) {

        throw new Error(
          t(
            "noItems"
          )
        );
      }


      configureSourceCycle();
    }


    // ======================================================
    // HYBRID MODE
    //
    // Local + live_server.py:
    //   /api/bootstrap
    //   /api/live-next
    //
    // GitHub Pages / normal static server:
    //   falls back to manifest.json
    // ======================================================

    function setupDeckFromData(data) {

      const rawItems =
        extractItems(
          data
        );


      items =
        rawItems
        .map(
          normalizeItem
        )
        .filter(
          Boolean
        );


      if (
        items.length === 0
      ) {

        throw new Error(
          t(
            "noItems"
          )
        );
      }


      configureSourceCycle();
    }


    async function loadBootstrapOrArchive() {

      try {

        const response =
          await fetch(
            "/api/bootstrap",
            {
              cache:
                "no-store"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok
          ||
          !data.ok
        ) {

          throw new Error(
            "Live bootstrap unavailable"
          );
        }


        setupDeckFromData(
          data
        );


        liveMode = true;


        console.log(
          "LIVE MODE / enabled"
        );


        return;
      }


      catch (error) {

        liveMode = false;


        console.log(
          "STATIC MODE / manifest.json"
        );


        await loadArchive();
      }
    }


    function cacheBustLiveUrl(url) {

      liveSequence += 1;


      return (
        url
        +
        (
          url.includes("?")
          ?
          "&"
          :
          "?"
        )
        +
        "live="
        +
        Date.now()
        +
        "_"
        +
        liveSequence
      );
    }


    async function preloadLiveItem(item) {

      return new Promise(
        resolve => {

          const preload =
            new Image();


          preload.decoding =
            "async";


          preload.onload =
            () => resolve(
              true
            );


          preload.onerror =
            () => resolve(
              false
            );


          preload.src =
            item.rendered_file;
        }
      );
    }


    async function requestLiveImage() {

      if (!liveMode) {

        return false;
      }


      const response =
        await fetch(
          "/api/live-next",
          {
            cache:
              "no-store"
          }
        );


      const data =
        await response.json();


      if (
        !response.ok
        ||
        !data.ok
        ||
        !data.ready
        ||
        !data.item
      ) {

        return false;
      }


      const item =
        normalizeItem(
          data.item
        );


      if (!item) {

        return false;
      }


      // El servidor puede reutilizar un filename.
      // La query obliga al navegador a leer la versión nueva.
      item.rendered_file =
        cacheBustLiveUrl(
          item.rendered_file
        );


      item._live =
        true;


      await preloadLiveItem(
        item
      );


      liveItems.push(
        item
      );


      return true;
    }


    async function fillLiveBuffer() {

      if (
        !liveMode
        ||
        liveRequestRunning
      ) {

        return;
      }


      liveRequestRunning =
        true;


      try {

        while (
          liveItems.length
          <
          LIVE_CLIENT_TARGET
        ) {

          const gotOne =
            await requestLiveImage();


          if (!gotOne) {

            break;
          }
        }
      }


      catch (error) {

        console.warn(
          "Live transform not ready",
          error
        );
      }


      finally {

        liveRequestRunning =
          false;
      }


      if (
        liveMode
        &&
        liveItems.length
        <
        LIVE_CLIENT_TARGET
      ) {

        setTimeout(
          fillLiveBuffer,
          700
        );
      }
    }


    function takeUnshownLiveItem() {

      while (
        liveItems.length > 0
      ) {

        const candidate =
          liveItems.shift();


        if (
          sourceAlreadyShown(
            candidate
          )
        ) {

          continue;
        }


        return candidate;
      }


      return null;
    }


    function wantsLiveOnThisStep() {

      return (
        liveMode
        &&
        forwardSequence
        %
        LIVE_EVERY
        ===
        0
      );
    }


    function takeDisplayItem() {

      prepareNewCycleIfNeeded();


      forwardSequence += 1;


      if (
        wantsLiveOnThisStep()
      ) {

        const live =
          takeUnshownLiveItem();


        if (live) {

          fillLiveBuffer();

          return live;
        }


        // Null means:
        // this slot wants a LIVE result, but it is not ready.
        // next() will briefly wait and show the processing text.

        return null;
      }


      return takeNextItem();
    }


    async function waitForUnshownLive(
      maxWaitMs = 5000
    ) {

      if (!liveMode) {
        return null;
      }


      showSearching(
        "processing"
      );


      const started =
        Date.now();


      try {

        while (
          Date.now()
          -
          started
          <
          maxWaitMs
        ) {

          let candidate =
            takeUnshownLiveItem();


          if (candidate) {

            return candidate;
          }


          await requestLiveImage();


          candidate =
            takeUnshownLiveItem();


          if (candidate) {

            return candidate;
          }


          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                450
              )
          );
        }


        return null;
      }


      finally {

        hideSearching();
      }
    }


    // ======================================================
    // TAKE NEXT ITEM
    // ======================================================

    function takeNextItem() {

      prepareNewCycleIfNeeded();


      while (true) {

        if (
          deckIndex
          >=
          deck.length
        ) {

          rebuildCycleDeck();


          if (
            deck.length === 0
          ) {

            return null;
          }
        }


        const item =
          deck[
            deckIndex
          ];


        deckIndex += 1;


        if (
          sourceAlreadyShown(
            item
          )
        ) {

          continue;
        }


        return item;
      }
    }


    // ======================================================
    // NEXT
    // ======================================================

    async function next() {

      // Walk forward through browser history first.
      // Revisiting history is intentionally allowed.

      if (
        historyIndex
        <
        history.length - 1
      ) {

        historyIndex += 1;


        showItem(
          history[
            historyIndex
          ]
        );


        preloadNext();


        return;
      }


      let item =
        takeDisplayItem();


      // Every LIVE slot waits briefly if the operation
      // is still being rendered. During that wait the
      // bilingual processing message is visible.

      if (
        !item
        &&
        wantsLiveOnThisStep()
      ) {

        item =
          await waitForUnshownLive(
            5000
          );
      }


      // If LIVE still is not ready after the short wait,
      // continue with an unseen pre-rendered source.
      // This avoids freezing navigation.

      if (!item) {

        item =
          takeNextItem();
      }


      if (!item) {

        return;
      }


      markSourceShown(
        item
      );


      history.push(
        item
      );


      historyIndex =
        history.length - 1;


      showItem(
        item
      );


      preloadNext();


      // Keep producing new transformations while viewing.
      fillLiveBuffer();
    }


    // ======================================================
    // PREVIOUS
    // ======================================================

    function previous() {

      if (
        historyIndex <= 0
      ) {

        return;
      }


      historyIndex -= 1;


      showItem(
        history[
          historyIndex
        ]
      );


      preloadNext();
    }


    // ======================================================
    // CONTROLS
    // ======================================================

    document
      .getElementById(
        "next"
      )
      .addEventListener(
        "click",
        next
      );


    document
      .getElementById(
        "prev"
      )
      .addEventListener(
        "click",
        previous
      );


    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key
          ===
          "ArrowRight"
        ) {

          next();
        }


        if (
          event.key
          ===
          "ArrowLeft"
        ) {

          previous();
        }
      }

    );


    // ======================================================
    // TOUCH / PAN / EDGE SWIPE
    //
    // Mobile behavior:
    // - horizontal images remain full-screen with object-fit: cover
    // - drag left/right to explore the cropped image
    // - after reaching an image edge, continue dragging to change image
    // - arrows continue to work normally
    // ======================================================

    const coarsePointer =
      window.matchMedia(
        "(hover: none) and (pointer: coarse)"
      );


    let currentImageFocusX = 50;
    let currentImageFocusY = 50;
    let mobilePanX = 50;

    let touchStartX = null;
    let touchStartY = null;
    let touchLastX = null;
    let touchPanStartX = 50;
    let touchHorizontal = false;
    let touchIgnored = false;
    let touchOverflowX = 0;
    let edgeOverscrollPx = 0;

    let panHintDismissed = false;
    let panHintTimer = null;

    const EDGE_NAV_THRESHOLD = 78;
    const NO_PAN_SWIPE_THRESHOLD = 105;
    const HORIZONTAL_LOCK_THRESHOLD = 7;


    function clampPercent(value) {

      if (!Number.isFinite(value)) {
        return 50;
      }

      return Math.max(
        0,
        Math.min(
          100,
          value
        )
      );
    }


    function isTouchInterface() {

      return (
        coarsePointer.matches
        ||
        navigator.maxTouchPoints > 0
      );
    }


    function horizontalImageOverflow() {

      if (
        !isTouchInterface()
        ||
        !image.naturalWidth
        ||
        !image.naturalHeight
      ) {

        return 0;
      }


      const rect =
        document
          .getElementById("stage")
          .getBoundingClientRect();


      if (
        rect.width <= 0
        ||
        rect.height <= 0
      ) {

        return 0;
      }


      const scale =
        Math.max(
          rect.width / image.naturalWidth,
          rect.height / image.naturalHeight
        );


      const displayedWidth =
        image.naturalWidth
        *
        scale;


      return Math.max(
        0,
        displayedWidth - rect.width
      );
    }


    function setMobilePanX(value) {

      mobilePanX =
        clampPercent(value);


      image.style.objectPosition =
        mobilePanX
        +
        "% "
        +
        currentImageFocusY
        +
        "%";
    }


    function hidePanHint() {

      if (panHintTimer) {
        clearTimeout(
          panHintTimer
        );

        panHintTimer = null;
      }


      panHint.classList.remove(
        "visible"
      );
    }


    function updatePanHint() {

      hidePanHint();


      if (
        panHintDismissed
        ||
        !isTouchInterface()
        ||
        horizontalImageOverflow() < 4
      ) {

        return;
      }


      panHint.textContent =
        t(
          "dragExplore"
        );


      panHint.classList.add(
        "visible"
      );


      panHintTimer =
        setTimeout(
          hidePanHint,
          2600
        );
    }


    function resetTouchGesture() {

      touchStartX = null;
      touchStartY = null;
      touchLastX = null;
      touchPanStartX = mobilePanX;
      touchHorizontal = false;
      touchIgnored = false;
      touchOverflowX = 0;
      edgeOverscrollPx = 0;
    }


    image.addEventListener(
      "load",
      () => {

        requestAnimationFrame(
          updatePanHint
        );
      }
    );


    window.addEventListener(
      "resize",
      () => {

        requestAnimationFrame(
          updatePanHint
        );
      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchstart",
      function(event) {

        if (
          event.touches.length !== 1
        ) {

          resetTouchGesture();
          return;
        }


        const target =
          event.target;


        touchIgnored =
          Boolean(
            target
            &&
            target.closest
            &&
            target.closest(
              "button"
            )
          );


        if (touchIgnored) {

          touchStartX = null;
          touchStartY = null;
          return;
        }


        touchStartX =
          event.touches[0].clientX;

        touchStartY =
          event.touches[0].clientY;

        touchLastX =
          touchStartX;

        touchPanStartX =
          mobilePanX;

        touchHorizontal = false;
        edgeOverscrollPx = 0;

        touchOverflowX =
          horizontalImageOverflow();
      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchmove",
      function(event) {

        if (
          touchIgnored
          ||
          touchStartX === null
          ||
          touchStartY === null
          ||
          event.touches.length !== 1
        ) {

          return;
        }


        const x =
          event.touches[0].clientX;

        const y =
          event.touches[0].clientY;

        const deltaX =
          x - touchStartX;

        const deltaY =
          y - touchStartY;


        if (!touchHorizontal) {

          if (
            Math.abs(deltaX)
            <
            HORIZONTAL_LOCK_THRESHOLD
            &&
            Math.abs(deltaY)
            <
            HORIZONTAL_LOCK_THRESHOLD
          ) {

            return;
          }


          if (
            Math.abs(deltaY)
            >
            Math.abs(deltaX)
          ) {

            touchIgnored = true;
            return;
          }


          touchHorizontal = true;
        }


        event.preventDefault();

        touchLastX = x;


        if (
          touchOverflowX > 3
        ) {

          const rawPosition =
            touchPanStartX
            -
            (
              deltaX
              /
              touchOverflowX
              *
              100
            );


          if (rawPosition < 0) {

            edgeOverscrollPx =
              (
                -rawPosition
                /
                100
              )
              *
              touchOverflowX;
          }

          else if (rawPosition > 100) {

            edgeOverscrollPx =
              (
                rawPosition - 100
              )
              /
              100
              *
              touchOverflowX;
          }

          else {

            edgeOverscrollPx = 0;
          }


          setMobilePanX(
            rawPosition
          );


          if (
            Math.abs(deltaX) > 10
          ) {

            panHintDismissed = true;
            hidePanHint();
          }
        }
      },
      {
        passive: false
      }
    );


    document.addEventListener(
      "touchend",
      function(event) {

        if (
          touchIgnored
          ||
          touchStartX === null
          ||
          event.changedTouches.length !== 1
        ) {

          resetTouchGesture();
          return;
        }


        const endX =
          event.changedTouches[0].clientX;

        const deltaX =
          endX - touchStartX;


        if (touchHorizontal) {

          if (
            touchOverflowX > 3
          ) {

            if (
              edgeOverscrollPx
              >=
              EDGE_NAV_THRESHOLD
            ) {

              if (deltaX < 0) {
                next();
              }

              else {
                previous();
              }
            }
          }

          else if (
            Math.abs(deltaX)
            >=
            NO_PAN_SWIPE_THRESHOLD
          ) {

            if (deltaX < 0) {
              next();
            }

            else {
              previous();
            }
          }
        }


        resetTouchGesture();
      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchcancel",
      resetTouchGesture,
      {
        passive: true
      }
    );


    // ======================================================
    // START
    // ======================================================

    async function start() {

      applyLanguage(
        currentLanguage,
        false
      );


      showSearching(
        "loading"
      );


      try {

        await loadBootstrapOrArchive();


        const first =
          takeNextItem();


        if (!first) {

          throw new Error(
            t(
              "noImage"
            )
          );
        }


        // Preload first image and immediate future images.

        preloadUrl(
          first.rendered_file
        );


        preloadNext();


        markSourceShown(
          first
        );


        history.push(
          first
        );


        historyIndex = 0;


        showItem(
          first
        );


        hideSearching();


        // Arranca el trabajo LIVE después de mostrar
        // inmediatamente una imagen ya renderizada.
        fillLiveBuffer();
      }


      catch (error) {

        console.error(
          error
        );


        searchingState =
          "error";


        searching.textContent =
          t(
            "error"
          )
          +
          " / "
          +
          error.message;


        searching.classList.add(
          "visible"
        );
      }
    }


    start();

  </script>

</body>
